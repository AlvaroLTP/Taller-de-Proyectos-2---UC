name: Tests and dependency audits
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r Backend/requirements-dev.txt
      - run: python -m ruff check Backend/app Backend/tests --select F401,F811,I
      - run: python -m pytest -q --cov=app --cov-report=term-missing
        working-directory: Backend
      - run: python -m pip_audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm run check
        working-directory: Frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-public-key
      - run: npm audit
        working-directory: Frontend
