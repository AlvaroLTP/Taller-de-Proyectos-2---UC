name: Tests and dependency audits
on: [push, pull_request]
jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical repository paths
        shell: bash
        run: |
          test -f .github/workflows/checks.yml
          test -f .github/workflows/monitor.yml
          test -f Programa_Proyectos_2/Backend/requirements-dev.txt
          test -f Programa_Proyectos_2/Frontend/package.json
          test -f Programa_Proyectos_2/Frontend/playwright.config.ts
          test -f Programa_Proyectos_2/Frontend/e2e/system.spec.ts
          test -f Programa_Proyectos_2/Frontend/e2e/performance.spec.ts
          test -f Programa_Proyectos_2/scripts/check.ps1
      - name: Validate local Markdown links in README and Sprint 4 documents
        shell: pwsh
        run: |
          $invalidLinks = [System.Collections.Generic.List[string]]::new()
          $documents = @(
            (Join-Path $env:GITHUB_WORKSPACE 'README.md'),
            (Join-Path $env:GITHUB_WORKSPACE 'docs/03_Implementacion/Sprint_4/01 Revisión del Sprint V_1_0_0.md'),
            (Join-Path $env:GITHUB_WORKSPACE 'docs/03_Implementacion/Sprint_4/02 Retrospectiva del Sprint V_1_0_0.md')
          )

          foreach ($document in $documents) {
            if (-not (Test-Path -LiteralPath $document)) {
              $invalidLinks.Add("Documento requerido ausente: $document")
              continue
            }

            $content = Get-Content -LiteralPath $document -Raw
            foreach ($match in [regex]::Matches($content, '\\]\\(([^)]+)\\)')) {
              $target = $match.Groups[1].Value.Trim().Trim('<>')
              if ($target -match '^(https?://|mailto:|#|data:)') { continue }

              $relativePath = [uri]::UnescapeDataString(($target -split '#', 2)[0])
              if ([string]::IsNullOrWhiteSpace($relativePath)) { continue }

              $candidate = Join-Path (Split-Path -Parent $document) $relativePath
              if (-not (Test-Path -LiteralPath $candidate)) {
                $invalidLinks.Add("$([IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $document)) -> $target")
              }
            }
          }

          if ($invalidLinks.Count -gt 0) {
            $invalidLinks | ForEach-Object { Write-Error $_ }
            throw "Se encontraron $($invalidLinks.Count) enlaces locales inválidos en los documentos validados."
          }
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Programa_Proyectos_2/Backend/requirements*.txt
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r Programa_Proyectos_2/Backend/requirements-dev.txt
      - run: python -m ruff check Programa_Proyectos_2/Backend/app Programa_Proyectos_2/Backend/tests --select F401,F811,I
      - run: python -m pytest -q --cov=app --cov-report=term-missing
        working-directory: Programa_Proyectos_2/Backend
      - run: python -m pip_audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Programa_Proyectos_2/Frontend/package-lock.json
      - run: npm ci
        working-directory: Programa_Proyectos_2/Frontend
      - run: npm run check
        working-directory: Programa_Proyectos_2/Frontend
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-public-key
      - run: npm audit
        working-directory: Programa_Proyectos_2/Frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Programa_Proyectos_2/Frontend/package-lock.json
      - run: python -m pip install -r Programa_Proyectos_2/Backend/requirements-dev.txt
      - run: npm ci
        working-directory: Programa_Proyectos_2/Frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: Programa_Proyectos_2/Frontend
      - run: npm run test:e2e
        working-directory: Programa_Proyectos_2/Frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            Programa_Proyectos_2/Frontend/playwright-report
            Programa_Proyectos_2/Frontend/test-results
          retention-days: 14
