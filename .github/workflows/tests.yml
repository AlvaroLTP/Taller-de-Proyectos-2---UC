name: Pruebas

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Programa_Proyectos_2/Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Programa_Proyectos_2/Frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vitest
          path: Programa_Proyectos_2/Frontend/reports/vitest.xml

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Programa_Proyectos_2/Backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Programa_Proyectos_2/Backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/pytest.xml --cov=app --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest
          path: Programa_Proyectos_2/Backend/reports/*.xml

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Programa_Proyectos_2/Frontend/package-lock.json
      - run: python -m pip install -r Programa_Proyectos_2/Backend/requirements-dev.txt
      - run: npm ci
        working-directory: Programa_Proyectos_2/Frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: Programa_Proyectos_2/Frontend
      - run: npm run test:e2e
        working-directory: Programa_Proyectos_2/Frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            Programa_Proyectos_2/Frontend/playwright-report
            Programa_Proyectos_2/Frontend/test-results
          retention-days: 14
